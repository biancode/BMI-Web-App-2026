<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gewicht eingeben – BMI Web App</title>
    <link rel="stylesheet" href="../../public/css/styles.min.css">
    <script src="./forms.js" defer></script>
  </head>
  <body class="bg-slate-50 p-8 text-slate-900">
    <main class="mx-auto max-w-sm">
      <h1 class="text-2xl font-bold">Gewicht</h1>
      <form id="weight-form" class="mt-4">
        <label for="weight" class="sr-only">Gewicht in Kilogramm</label>
        <div class="flex items-center gap-2">
          <input
            id="weight"
            name="weight"
            type="number"
            min="0.1"
            step="0.1"
            inputmode="decimal"
            placeholder="z. B. 75,5"
            required
            class="w-full min-w-0 rounded border border-slate-300 bg-white px-3 py-2 focus:outline-blue-700"
          >
          <span aria-hidden="true" class="text-slate-600">kg</span>
          <button type="submit" class="rounded bg-blue-700 px-3 py-2 text-white hover:bg-blue-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700">OK</button>
        </div>
        <p id="weight-result" role="status" class="mt-2 text-sm text-slate-600"></p>
      </form>
      <a class="mt-4 inline-block text-blue-700 underline" href="../index/index.html">Zur Startseite</a>
    </main>
  </body>
</html>
