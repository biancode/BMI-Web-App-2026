<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BMI Calculator</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <!-- Header -->
    <div class="header">
        <div class="logo">BMI Tracker</div>
    </div>

    <!-- Main Layout -->
    <div class="main-layout">

        <!-- Sidebar -->
        <div class="sidebar">

            <div><a href="#" onclick="LoadPage('../dashboard/dashboard.html'); return false;">dashboard</a></div>
            <div><a href="#" onclick="LoadPage('../forms/forms.html'); return false;">forms</a></div>
            <div><a href="#" onclick="LoadPage('../tabels/table.html'); return false;">Tabelle</a></div>
            <div><a href="#" onclick="LoadPage('../settings/settings.html'); return false;">Einstellungen</a></div>

        </div>

        <!-- Body -->
        <div class="body-container">

            <custom-body>

                <div id="custom-body"></div>

            </custom-body>

        </div>
    </div>

    <!-- Footer -->
    <div class="footer">

        <div>
            © 2026 BMI Tracker
        </div>

    </div>

    <script>
        function LoadPage(url)
        {
            try
            {
                console.log("Loading Page: " + url);
                document.getElementById("custom-body").innerHTML = `
                    <div>
                        <iframe style="width: 100%; height: 50vh; border: 0" src="${url}"></iframe>
                    </div>
                `;
            }
            catch (e)
            {
                console.log(e)
            }
        }
    </script>

</body>

</html>
